<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="TEKA NEXUS banner">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6E5512"/>
      <stop offset="0.22" stop-color="#C9A227"/>
      <stop offset="0.5" stop-color="#F7E394"/>
      <stop offset="0.78" stop-color="#C9A227"/>
      <stop offset="1" stop-color="#6E5512"/>
    </linearGradient>
    <linearGradient id="frameLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="1"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFF3C4" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#D4AF37" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="titleClip">
      <text x="600" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="96" letter-spacing="14">TEKA NEXUS</text>
    </clipPath>
    <path id="orbitPath" d="M130,170 C130,98 343,42 600,42 C857,42 1070,98 1070,170 C1070,242 857,298 600,298 C343,298 130,242 130,170 Z" fill="none" stroke="none"/>
  </defs>

  <!-- deep black canvas + gold ambience -->
  <rect width="1200" height="340" fill="#050505"/>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- faint engineering grid -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.05">
    <path d="M0 85 H1200 M0 170 H1200 M0 255 H1200"/>
    <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340 M600 0 V340 M700 0 V340 M800 0 V340 M900 0 V340 M1000 0 V340 M1100 0 V340"/>
  </g>

  <!-- orbit ring + travelling light -->
  <use href="#orbitPath" stroke="#D4AF37" stroke-width="1" opacity="0.08" fill="none"/>
  <circle r="2.6" fill="#F7E394">
    <animateMotion dur="16s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbitPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle r="1.8" fill="#C9A227" opacity="0.7">
    <animateMotion dur="16s" begin="-8s" repeatCount="indefinite">
      <mpath href="#orbitPath"/>
    </animateMotion>
  </circle>

  <!-- gold particle field -->
  <g fill="#E9C75C">
    <circle cx="120" cy="70" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="250" r="1.2"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="110" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="395" cy="300" r="1.3"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="290" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="80" r="1.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="725" cy="310" r="1.2"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="4.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="95" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.3s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="260" r="1.3"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="985" cy="130" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1075" cy="240" r="1.4"><animate attributeName="opacity" values="0.12;0.85;0.12" dur="4.4s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="180" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="60" r="1.2"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="205" r="1.0"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="5.1s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="175" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.0s" begin="1.0s" repeatCount="indefinite"/></circle>
  </g>

  <!-- brand title -->
  <text x="600" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="96" letter-spacing="14" fill="url(#gold)">TEKA NEXUS</text>

  <!-- metallic shine sweep, clipped to the wordmark -->
  <g clip-path="url(#titleClip)">
    <rect x="-340" y="80" width="240" height="160" fill="url(#shineGrad)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1660 0" dur="5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- tagline -->
  <text x="600" y="248" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="18" letter-spacing="9" fill="#E9DCA8" opacity="0">WHERE IDEAS BECOME REAL TECHNOLOGY
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- luxury hairline frame + corner brackets -->
  <rect x="6" y="6" width="1188" height="328" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.30"/>
  <rect x="14" y="14" width="1172" height="312" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.14"/>
  <g stroke="#F7E394" stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M26 54 V26 H54"/>
    <path d="M1146 26 H1174 V54"/>
    <path d="M1174 286 V314 H1146"/>
    <path d="M54 314 H26 V286"/>
  </g>
  <line x1="330" y1="300" x2="870" y2="300" stroke="url(#frameLine)" stroke-width="1.2" opacity="0.6"/>
</svg>
