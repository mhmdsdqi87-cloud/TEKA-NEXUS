plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.teka.nexus'
    compileSdk 36

    defaultConfig {
        applicationId 'ir.teka.nexus'
        minSdk 24
        targetSdk 34
        // v1.0.2 (code 3): TWA → native WebView shell (Myket Force Close fix:
        // no browser dependency at all) + offline retry view + deep links.
        versionCode 3
        versionName '1.0.2'
    }

    signingConfigs {
        release {
            // Keystore + passwords live OUTSIDE the repo (see docs/MYKET.md §بازسازی).
            // Provide TEKA_STORE_PASS / TEKA_KEY_PASS env vars when building release.
            storeFile file(System.getenv('TEKA_KEYSTORE_PATH') ?: '../keystore/teka-release.keystore')
            storePassword System.getenv('TEKA_STORE_PASS') ?: ''
            keyAlias 'teka'
            keyPassword System.getenv('TEKA_KEY_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // v1.0.2: androidbrowserhelper (TWA) removed on purpose.
    // appcompat: theme + AppCompatActivity; swiperefreshlayout: pull-to-refresh.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
