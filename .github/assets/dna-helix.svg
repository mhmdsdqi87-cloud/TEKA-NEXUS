<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="animated golden DNA helix">
  <defs>
    <radialGradient id="dGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="dClip">
      <rect x="24" y="20" width="852" height="220" rx="10"/>
    </clipPath>
    <g id="helixSeg">
      <g stroke="#22D3EE" stroke-width="1.4" opacity="0.55">
        <line x1="30" y1="155" x2="30" y2="105"/>
        <line x1="60" y1="180" x2="60" y2="80"/>
        <line x1="90" y1="190" x2="90" y2="70"/>
        <line x1="120" y1="200" x2="120" y2="60"/>
        <line x1="150" y1="190" x2="150" y2="70"/>
        <line x1="180" y1="180" x2="180" y2="80"/>
        <line x1="210" y1="155" x2="210" y2="105"/>
        <line x1="270" y1="105" x2="270" y2="155"/>
        <line x1="300" y1="80" x2="300" y2="180"/>
        <line x1="330" y1="70" x2="330" y2="190"/>
        <line x1="360" y1="60" x2="360" y2="200"/>
        <line x1="390" y1="70" x2="390" y2="190"/>
        <line x1="420" y1="80" x2="420" y2="180"/>
        <line x1="450" y1="105" x2="450" y2="155"/>
      </g>
      <path d="M0 130 Q15 142 30 155 T60 180 T90 190 T120 200 T150 190 T180 180 T210 155 T240 130 T270 105 T300 80 T330 70 T360 60 T390 70 T420 80 T450 105 T480 130" fill="none" stroke="#22D3EE" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M0 130 Q15 118 30 105 T60 80 T90 70 T120 60 T150 70 T180 80 T210 105 T240 130 T270 155 T300 180 T330 190 T360 200 T390 190 T420 180 T450 155 T480 130" fill="none" stroke="#A5F3FC" stroke-width="2.6" stroke-linecap="round"/>
      <g fill="#ECFEFF">
        <circle cx="0" cy="130" r="3.4"/><circle cx="120" cy="200" r="3.4"/><circle cx="240" cy="130" r="3.4"/><circle cx="360" cy="60" r="3.4"/><circle cx="480" cy="130" r="3.4"/>
      </g>
      <g fill="#22D3EE">
        <circle cx="60" cy="180" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="300" cy="80" r="3"/><circle cx="420" cy="80" r="3"/>
      </g>
    </g>
  </defs>

  <rect x="1" y="1" width="898" height="258" rx="16" fill="#08080D"/>
  <rect x="1" y="1" width="898" height="258" rx="16" fill="url(#dGlow)"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="16" fill="none" stroke="#22D3EE" opacity="0.35"/>
  <rect x="10" y="10" width="880" height="240" rx="12" fill="none" stroke="#22D3EE" opacity="0.12"/>

  <g clip-path="url(#dClip)" transform="translate(0 0)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-480 0" dur="7s" repeatCount="indefinite"/>
      <use href="#helixSeg" x="0"/>
      <use href="#helixSeg" x="480"/>
      <use href="#helixSeg" x="960"/>
      <use href="#helixSeg" x="1440"/>
    </g>
  </g>

  <line x1="310" y1="238" x2="590" y2="238" stroke="#22D3EE" stroke-width="1" opacity="0.35"/>
</svg>
