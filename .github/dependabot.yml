# Dependabot — keep GitHub Actions fresh.
# App dependencies are handled by Bun/Vercel; workflows are the only
# third-party surface that rots silently, so bump those automatically.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "ci"
