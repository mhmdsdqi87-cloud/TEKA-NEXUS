<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="TEKA NEXUS cosmic banner">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.34" stop-color="#22D3EE"/>
      <stop offset="0.78" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <linearGradient id="frameLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ECFEFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cometTail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity="0"/>
      <stop offset="1" stop-color="#ECFEFF" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.14"/>
      <stop offset="0.6" stop-color="#22D3EE" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#155E75" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#155E75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1C1530" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1C1530" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0E7490" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0E7490" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="galaxyCore" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ECFEFF" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#22D3EE" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetGrad" cx="0.35" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#1C1530"/>
      <stop offset="1" stop-color="#08080D"/>
    </radialGradient>
    <clipPath id="titleClip">
      <text x="600" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="96" letter-spacing="14">TEKA NEXUS</text>
    </clipPath>
    <path id="orbitPath" d="M130,170 C130,98 343,42 600,42 C857,42 1070,98 1070,170 C1070,242 857,298 600,298 C343,298 130,242 130,170 Z" fill="none" stroke="none"/>
  </defs>

  <!-- deep space canvas -->
  <rect width="1200" height="340" fill="#08080D"/>

  <!-- drifting nebulae -->
  <ellipse cx="330" cy="90" rx="360" ry="150" fill="url(#nebulaB)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 45 -12; 0 0" dur="46s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="880" cy="240" rx="420" ry="160" fill="url(#nebulaA)">
    <animateTransform attributeName="transform" type="translate" values="0 0; -40 14; 0 0" dur="58s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="600" cy="150" rx="500" ry="130" fill="url(#nebulaC)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 30 10; 0 0" dur="70s" repeatCount="indefinite"/>
  </ellipse>
  <rect width="1200" height="340" fill="url(#glow)"/>

  <!-- faint engineering grid -->
  <g stroke="#22D3EE" stroke-width="1" opacity="0.04">
    <path d="M0 85 H1200 M0 170 H1200 M0 255 H1200"/>
    <path d="M100 0 V340 M200 0 V340 M300 0 V340 M400 0 V340 M500 0 V340 M600 0 V340 M700 0 V340 M800 0 V340 M900 0 V340 M1000 0 V340 M1100 0 V340"/>
  </g>

  <!-- spiral galaxy, slowly rotating -->
  <g transform="translate(168 88)" opacity="0.6">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="140s" repeatCount="indefinite"/>
      <ellipse rx="72" ry="20" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.5" transform="rotate(24)"/>
      <ellipse rx="72" ry="20" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.32" transform="rotate(-38)"/>
      <ellipse rx="46" ry="12" fill="none" stroke="#A5F3FC" stroke-width="0.8" opacity="0.4" transform="rotate(80)"/>
      <circle r="2.6" fill="#ECFEFF"/>
    </g>
    <ellipse rx="30" ry="30" fill="url(#galaxyCore)">
      <animate attributeName="rx" values="27;35;27" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="27;35;27" dur="7s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- orbit ring + travelling light -->
  <use href="#orbitPath" stroke="#22D3EE" stroke-width="1" opacity="0.07" fill="none"/>
  <circle r="2.4" fill="#A5F3FC">
    <animateMotion dur="18s" repeatCount="indefinite" rotate="auto">
      <mpath href="#orbitPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="18s" repeatCount="indefinite"/>
  </circle>

  <!-- ringed planet, gently bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="1058 274; 1058 268; 1058 274" dur="9s" repeatCount="indefinite"/>
    <circle r="17" fill="url(#planetGrad)" stroke="#0E7490" stroke-width="1"/>
    <ellipse rx="31" ry="8" fill="none" stroke="#22D3EE" stroke-width="1.3" opacity="0.8" transform="rotate(-16)"/>
    <circle r="2.2" fill="#A5F3FC" cx="-26" cy="-24">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- star field -->
  <g fill="#67E8F9">
    <circle cx="120" cy="70" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="250" r="1.2"><animate attributeName="opacity" values="0.1;0.75;0.1" dur="4.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="310" cy="110" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="395" cy="300" r="1.3"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="60" r="1.5"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" begin="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="545" cy="290" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="80" r="1.9"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="725" cy="310" r="1.2"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="4.1s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="810" cy="95" r="1.6"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.3s" begin="2.0s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="260" r="1.3"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.7s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="985" cy="130" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="1075" cy="240" r="1.4"><animate attributeName="opacity" values="0.12;0.85;0.12" dur="4.4s" begin="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="180" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.9s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="60" r="1.2"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.6s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="205" r="1.0"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="5.1s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="855" cy="175" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.0s" begin="1.0s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="210" r="1.4"><animate attributeName="opacity" values="0.12;0.85;0.12" dur="3.5s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="1130" cy="120" r="1.5"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.7s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="150" r="1.0"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.4s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="45" r="1.2"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="4.3s" begin="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="140" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="5.0s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="235" r="1.3"><animate attributeName="opacity" values="0.12;0.8;0.12" dur="3.9s" begin="2.1s" repeatCount="indefinite"/></circle>
  </g>
  <!-- sparkle crosses -->
  <g stroke="#ECFEFF" stroke-width="1" fill="none">
    <path d="M292 62 H304 M298 56 V68"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.2s" repeatCount="indefinite"/></path>
    <path d="M918 76 H930 M924 70 V82"><animate attributeName="opacity" values="0.15;1;0.15" dur="5.3s" begin="1.6s" repeatCount="indefinite"/></path>
    <path d="M132 268 H142 M137 263 V273"><animate attributeName="opacity" values="0.15;0.95;0.15" dur="4.8s" begin="2.7s" repeatCount="indefinite"/></path>
  </g>

  <!-- comet crossing -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.72;1" dur="13s" repeatCount="indefinite"/>
    <animateMotion path="M -110 55 L 1310 215" dur="13s" repeatCount="indefinite" rotate="auto"/>
    <rect x="-100" y="-1.6" width="100" height="3.2" fill="url(#cometTail)" rx="1.6"/>
    <circle r="3.4" fill="#ECFEFF"/>
  </g>

  <!-- brand title -->
  <text x="600" y="192" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="96" letter-spacing="14" fill="url(#gold)">TEKA NEXUS</text>

  <!-- metallic shine sweep, clipped to the wordmark -->
  <g clip-path="url(#titleClip)">
    <rect x="-340" y="80" width="240" height="160" fill="url(#shineGrad)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" values="0 0; 1660 0" dur="5s" repeatCount="indefinite" additive="sum"/>
    </rect>
  </g>

  <!-- tagline + self-drawing underline -->
  <text x="600" y="248" text-anchor="middle" font-family="Verdana, Arial, sans-serif" font-size="18" letter-spacing="9" fill="#A5F3FC" opacity="0">WHERE IDEAS BECOME REAL TECHNOLOGY
    <animate attributeName="opacity" values="0;1" dur="1.4s" begin="0.3s" fill="freeze"/>
  </text>
  <path d="M330 268 H870" stroke="url(#frameLine)" stroke-width="1.2" stroke-dasharray="540" stroke-dashoffset="540">
    <animate attributeName="stroke-dashoffset" values="540;0" dur="1.8s" begin="0.7s" fill="freeze"/>
  </path>

  <!-- aurora waves -->
  <path d="M-200 318 C 100 300 400 322 600 312 S 1000 300 1400 316 V340 H-200 Z" fill="url(#nebulaC)" opacity="0.55">
    <animateTransform attributeName="transform" type="translate" values="-140 0;140 0;-140 0" dur="24s" repeatCount="indefinite"/>
  </path>
  <path d="M-200 328 C 240 312 480 332 720 322 S 1040 314 1400 326 V340 H-200 Z" fill="url(#nebulaA)" opacity="0.65">
    <animateTransform attributeName="transform" type="translate" values="120 0;-120 0;120 0" dur="32s" repeatCount="indefinite"/>
  </path>

  <!-- luxury hairline frame + corner brackets -->
  <rect x="6" y="6" width="1188" height="328" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.30"/>
  <rect x="14" y="14" width="1172" height="312" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.14"/>
  <g stroke="#A5F3FC" stroke-width="2.4" fill="none" opacity="0.85">
    <path d="M26 54 V26 H54"/>
    <path d="M1146 26 H1174 V54"/>
    <path d="M1174 286 V314 H1146"/>
    <path d="M54 314 H26 V286"/>
  </g>
</svg>
