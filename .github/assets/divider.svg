<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" role="img" aria-label="gold comet divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A5F3FC" stop-opacity="0"/>
      <stop offset="1" stop-color="#ECFEFF" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="40" y="2.5" width="1120" height="1" fill="url(#g)" opacity="0.55"/>
  <g>
    <animateTransform attributeName="transform" type="translate" values="40 0;1160 0;40 0" dur="8.5s" repeatCount="indefinite"/>
    <rect x="-70" y="2.2" width="70" height="1.6" fill="url(#trail)" rx="0.8"/>
    <circle r="2.6" fill="#A5F3FC" cy="3">
      <animate attributeName="opacity" values="0.25;1;0.25" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
