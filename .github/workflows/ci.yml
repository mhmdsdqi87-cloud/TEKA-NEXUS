# TEKA NEXUS — Continuous Integration
# Runs on every push to main and every pull request:
# lint → typecheck → unit tests (pylite engine, exam engine, i18n key parity,
# platform kernel). Minimal on purpose — no caching, no deploy steps.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun test
