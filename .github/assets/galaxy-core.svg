<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="rotating golden galaxy">
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ECFEFF" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#22D3EE" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#155E75" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#155E75" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="panelGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="1"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="898" height="298" rx="16" fill="#08080D"/>
  <rect x="1" y="1" width="898" height="298" rx="16" fill="url(#panelGlow)"/>
  <rect x="1.5" y="1.5" width="897" height="297" rx="16" fill="none" stroke="#22D3EE" opacity="0.35"/>
  <rect x="10" y="10" width="880" height="280" rx="12" fill="none" stroke="#22D3EE" opacity="0.12"/>

  <!-- ambient stars -->
  <g fill="#67E8F9">
    <circle cx="90" cy="60" r="1.3"><animate attributeName="opacity" values="0.15;0.85;0.15" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="220" r="1.1"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="4.6s" begin="0.7s" repeatCount="indefinite"/></circle>
    <circle cx="290" cy="80" r="1.5"><animate attributeName="opacity" values="0.2;0.95;0.2" dur="3.0s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="250" r="1.0"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="60" r="1.4"><animate attributeName="opacity" values="0.15;0.9;0.15" dur="3.8s" begin="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="230" r="1.2"><animate attributeName="opacity" values="0.12;0.75;0.12" dur="4.3s" begin="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="110" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="150" r="0.9"><animate attributeName="opacity" values="0.1;0.55;0.1" dur="5.6s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="40" r="1.0"><animate attributeName="opacity" values="0.1;0.65;0.1" dur="4.9s" begin="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="160" r="0.9"><animate attributeName="opacity" values="0.1;0.6;0.1" dur="5.0s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M278 66 H288 M283 61 V71" stroke="#ECFEFF" stroke-width="1" fill="none"><animate attributeName="opacity" values="0.15;1;0.15" dur="4.4s" repeatCount="indefinite"/></path>

  <!-- the galaxy -->
  <ellipse cx="450" cy="150" rx="240" ry="140" fill="url(#halo)"/>
  <g transform="translate(450 150)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="64s" repeatCount="indefinite"/>
      <ellipse rx="150" ry="46" fill="none" stroke="#22D3EE" stroke-width="1.4" opacity="0.5" transform="rotate(22)"/>
      <ellipse rx="150" ry="46" fill="none" stroke="#22D3EE" stroke-width="1.4" opacity="0.34" transform="rotate(-44)"/>
      <ellipse rx="104" ry="30" fill="none" stroke="#A5F3FC" stroke-width="1" opacity="0.4" transform="rotate(84)"/>
      <ellipse rx="66" ry="18" fill="none" stroke="#A5F3FC" stroke-width="0.9" opacity="0.3" transform="rotate(-12)"/>
      <circle cx="118" cy="-42" r="1.8" fill="#ECFEFF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="-130" cy="30" r="1.6" fill="#A5F3FC"><animate attributeName="opacity" values="0.25;0.95;0.25" dur="4.1s" begin="1.1s" repeatCount="indefinite"/></circle>
      <circle cx="24" cy="-70" r="1.4" fill="#67E8F9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.7s" begin="2.2s" repeatCount="indefinite"/></circle>
      <circle cx="-60" cy="58" r="1.5" fill="#67E8F9"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.5s" begin="0.6s" repeatCount="indefinite"/></circle>
      <circle r="3.2" fill="#ECFEFF"/>
    </g>
    <ellipse rx="42" ry="42" fill="url(#core)">
      <animate attributeName="rx" values="38;48;38" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="ry" values="38;48;38" dur="6s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- companion orbits -->
  <g transform="rotate(-14 450 150)">
    <ellipse cx="450" cy="150" rx="250" ry="80" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.16" stroke-dasharray="3 7">
      <animate attributeName="stroke-dashoffset" values="0;40" dur="9s" repeatCount="indefinite"/>
    </ellipse>
    <g>
      <animateMotion dur="16s" repeatCount="indefinite" path="M 700,150 A 250 80 0 1 1 200,150 A 250 80 0 1 1 700,150 Z"/>
      <circle r="3.4" fill="#A5F3FC"/>
    </g>
    <g>
      <animateMotion dur="24s" begin="-8s" repeatCount="indefinite" path="M 700,150 A 250 80 0 1 1 200,150 A 250 80 0 1 1 700,150 Z"/>
      <circle r="2.2" fill="#22D3EE"/>
    </g>
  </g>

  <line x1="240" y1="278" x2="660" y2="278" stroke="url(#frame)" stroke-width="1" opacity="0.5"/>
</svg>
