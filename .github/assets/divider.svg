<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6" viewBox="0 0 1200 6" role="img" aria-label="gold divider">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#D4AF37" stop-opacity="1"/>
      <stop offset="1" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="2.5" width="1120" height="1" fill="url(#g)" opacity="0.55"/>
  <circle r="2.6" fill="#F7E394" cy="3">
    <animate attributeName="cx" values="40;1160;40" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.25;1;0.25" dur="7s" repeatCount="indefinite"/>
  </circle>
</svg>
